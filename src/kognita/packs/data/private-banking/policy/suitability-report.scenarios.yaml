rule: suitability-report
scenarios:
  - name: "a suitability report needs a person"
    given:
      principal: "rm.lee"
      purpose: CLIENT_DISCUSSION
      tool: draft_suitability_report
      actor_location: SG
      attributes:
        booking_centre: SG
        rm_location: SG
        client_domicile: SG
        solicitation: permitted
        research_distribution: permitted
        product_eligible: true
        suitable: true
        within_mandate: true
        within_concentration: true
        relationship_manager: "rm.lee"
        contact_count: 0
    when:
      tool: draft_suitability_report
    then:
      decision: HUMAN_APPROVAL
      cites: suitability-report
