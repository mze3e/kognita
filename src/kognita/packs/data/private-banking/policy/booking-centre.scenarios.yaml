rule: booking-centre
scenarios:
  - name: "an RM may discuss a product from a recognised booking centre"
    given:
      principal: "rm.lee"
      purpose: CLIENT_DISCUSSION
      tool: discuss_product
      actor_location: SG
      attributes:
        booking_centre: SG
        rm_location: SG
        client_domicile: SG
        solicitation: permitted
        research_distribution: permitted
        product_eligible: true
        suitable: true
        within_mandate: true
        within_concentration: true
        relationship_manager: "rm.lee"
        contact_count: 0
    when:
      tool: discuss_product
    then:
      decision: ALLOW
      cites: booking-centre
  - name: "pre-call preparation from a recognised booking centre is permitted"
    given:
      principal: "rm.lee"
      purpose: CLIENT_DISCUSSION
      tool: prepare_call
      actor_location: SG
      attributes:
        booking_centre: SG
        rm_location: SG
        client_domicile: SG
        solicitation: permitted
        research_distribution: permitted
        product_eligible: true
        suitable: true
        within_mandate: true
        within_concentration: true
        relationship_manager: "rm.lee"
        contact_count: 0
    when:
      tool: prepare_call
    then:
      decision: ALLOW
      cites: booking-centre
  - name: "a portfolio review from a recognised booking centre is permitted"
    given:
      principal: "rm.lee"
      purpose: CLIENT_DISCUSSION
      tool: review_portfolio
      actor_location: SG
      attributes:
        booking_centre: SG
        rm_location: SG
        client_domicile: SG
        solicitation: permitted
        research_distribution: permitted
        product_eligible: true
        suitable: true
        within_mandate: true
        within_concentration: true
        relationship_manager: "rm.lee"
        contact_count: 0
    when:
      tool: review_portfolio
    then:
      decision: ALLOW
      cites: booking-centre
  - name: "a booking centre outside the recognised list is refused"
    given:
      principal: "rm.lee"
      purpose: CLIENT_DISCUSSION
      tool: discuss_product
      actor_location: SG
      attributes:
        booking_centre: US
        rm_location: SG
        client_domicile: SG
        solicitation: permitted
        research_distribution: permitted
        product_eligible: true
        suitable: true
        within_mandate: true
        within_concentration: true
        relationship_manager: "rm.lee"
        contact_count: 0
    when:
      tool: discuss_product
    then:
      decision: DENY
      cites: booking-centre
