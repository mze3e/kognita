rule: client-communication
scenarios:
  - name: "releasing a client communication needs two signatures"
    given:
      principal: "rm.lee"
      purpose: CLIENT_DISCUSSION
      tool: release_client_communication
      actor_location: SG
      attributes:
        booking_centre: SG
        rm_location: SG
        client_domicile: SG
        solicitation: permitted
        research_distribution: permitted
        product_eligible: true
        suitable: true
        within_mandate: true
        within_concentration: true
        relationship_manager: "rm.lee"
        contact_count: 0
        communication_level: "product recommendation"
        lane: client
        content: "Past performance is not a guide to future performance. This message used AI."
        tone: neutral
        channel: "secure message"
        recipient_jurisdiction: SG
        risk_language: true
        research_attribution: "House View Q3"
        disclosure_triggers:
          - "AI generated content"
    when:
      tool: release_client_communication
    then:
      decision: HUMAN_APPROVAL
      cites: client-communication
