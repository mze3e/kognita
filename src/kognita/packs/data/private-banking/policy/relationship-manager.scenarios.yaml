rule: relationship-manager
scenarios:
  - name: "a principal who is not the assigned RM is refused"
    given:
      principal: "rm.other"
      purpose: CLIENT_DISCUSSION
      tool: discuss_product
      actor_location: SG
      attributes:
        booking_centre: SG
        rm_location: SG
        client_domicile: SG
        solicitation: permitted
        research_distribution: permitted
        product_eligible: true
        suitable: true
        within_mandate: true
        within_concentration: true
        relationship_manager: "rm.lee"
        contact_count: 0
    when:
      tool: discuss_product
    then:
      decision: DENY
      cites: relationship-manager
