rule: booking-center
scenarios:
  - name: "an RM may discuss a product from a recognized booking center"
    given:
      principal: "rm.lee"
      purpose: CLIENT_DISCUSSION
      tool: discuss_product
      actor_location: SG
      attributes:
        booking_center: SG
        rm_location: SG
        client_domicile: SG
        solicitation: permitted
        research_distribution: permitted
        product_eligible: true
        suitable: true
        within_mandate: true
        within_concentration: true
        relationship_manager: "rm.lee"
        contact_count: 0
    when:
      tool: discuss_product
    then:
      decision: ALLOW
      cites: booking-center
  - name: "pre-call preparation from a recognized booking center is permitted"
    given:
      principal: "rm.lee"
      purpose: CLIENT_DISCUSSION
      tool: prepare_call
      actor_location: SG
      attributes:
        booking_center: SG
        rm_location: SG
        client_domicile: SG
        solicitation: permitted
        research_distribution: permitted
        product_eligible: true
        suitable: true
        within_mandate: true
        within_concentration: true
        relationship_manager: "rm.lee"
        contact_count: 0
    when:
      tool: prepare_call
    then:
      decision: ALLOW
      cites: booking-center
  - name: "a portfolio review from a recognized booking center is permitted"
    given:
      principal: "rm.lee"
      purpose: CLIENT_DISCUSSION
      tool: review_portfolio
      actor_location: SG
      attributes:
        booking_center: SG
        rm_location: SG
        client_domicile: SG
        solicitation: permitted
        research_distribution: permitted
        product_eligible: true
        suitable: true
        within_mandate: true
        within_concentration: true
        relationship_manager: "rm.lee"
        contact_count: 0
    when:
      tool: review_portfolio
    then:
      decision: ALLOW
      cites: booking-center
  - name: "a booking center outside the recognized list is refused"
    given:
      principal: "rm.lee"
      purpose: CLIENT_DISCUSSION
      tool: discuss_product
      actor_location: SG
      attributes:
        booking_center: US
        rm_location: SG
        client_domicile: SG
        solicitation: permitted
        research_distribution: permitted
        product_eligible: true
        suitable: true
        within_mandate: true
        within_concentration: true
        relationship_manager: "rm.lee"
        contact_count: 0
    when:
      tool: discuss_product
    then:
      decision: DENY
      cites: booking-center
