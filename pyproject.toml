[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "kognita"
version = "0.2.0"
description = "Prove an AI answer was permitted — and evidence it. A governed decision, retrieval and knowledge-graph library."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmed Muzammil" }]
keywords = [
    "governance",
    "policy-decision-point",
    "audit",
    "compliance",
    "knowledge-graph",
    "graphiti",
    "kuzu",
    "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

# The core must install and run on these four alone. Anything that reaches an
# external system — a graph database, an LLM, a vector extension — is an extra.
dependencies = [
    "pydantic>=2.7.0",
    "sqlmodel>=0.0.22",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
graph = [
    "graphiti-core[kuzu]==0.28.2",
    "kuzu==0.11.3",
    # graphiti-core 0.28.2 imports `httpx`; openai 3.x moved to `httpx2`, so the
    # pair breaks at import time. Cap until graphiti-core catches up.
    "openai>=1.91.0,<2",
]
openai = ["openai>=1.91.0,<2"]
anthropic = ["graphiti-core[anthropic]==0.28.2"]
groq = ["graphiti-core[groq]==0.28.2"]
gemini = ["graphiti-core[google-genai]==0.28.2"]
vec = ["sqlite-vec>=0.1.6"]
local-embeddings = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sentence-transformers>=3.0.0",
]
all = [
    "kognita[graph,openai,anthropic,groq,gemini,vec,local-embeddings]",
]
dev = [
    "pytest>=8.0.0",
    "import-linter>=2.0",
]

[project.scripts]
kognita = "kognita.cli:main"

[project.urls]
Homepage = "https://github.com/mze3e/kognita"
Repository = "https://github.com/mze3e/kognita"
Issues = "https://github.com/mze3e/kognita/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kognita"]

[tool.hatch.build.targets.sdist]
include = [
    "src/kognita/**",
    "tests/**",
    "examples/**",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

# ── Layering contracts ───────────────────────────────────────────────────────
# The decision engine lives directly in `kognita`, and must stay installable on
# the four hard dependencies. These contracts are what stop that from quietly
# regressing.
#
# Because the engine is a flat set of modules rather than a subpackage, the
# first contract has to name them. `tests/test_packaging.py` asserts that list
# covers every module actually present, so adding a module without listing it
# fails loudly instead of silently escaping the contract.
[tool.importlinter]
root_packages = ["kognita"]
# Required so the forbidden contracts can name third-party packages.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "the decision engine reaches nothing optional"
type = "forbidden"
source_modules = [
    "kognita.approvals",
    "kognita.broker",
    "kognita.canonical",
    "kognita.classify",
    "kognita.db",
    "kognita.egress",
    "kognita.embedding",
    "kognita.envelope",
    "kognita.evidence",
    "kognita.governance",
    "kognita.models",
    "kognita.protocols",
    "kognita.registry",
    "kognita.retrieval",
    "kognita.rules",
    "kognita.tools",
    "kognita.vectors",
    "kognita.vocabulary",
]
forbidden_modules = [
    "kognita.graph",
    "kognita.adapters",
    "kognita.testing",
    "kognita.cli",
    "graphiti_core",
    "kuzu",
    "openai",
    "anthropic",
    "streamlit",
]

[[tool.importlinter.contracts]]
name = "the graph engine and the adapters stay independent"
type = "independence"
modules = ["kognita.graph", "kognita.adapters"]

[[tool.importlinter.contracts]]
name = "config and exceptions stay dependency-free"
type = "forbidden"
source_modules = ["kognita.config", "kognita.exceptions"]
forbidden_modules = [
    "kognita.governance",
    "kognita.models",
    "kognita.evidence",
    "kognita.retrieval",
    "kognita.egress",
    "kognita.graph",
    "kognita.adapters",
    "kognita.testing",
    "kognita.cli",
    "pydantic",
    "sqlmodel",
    "numpy",
    "requests",
]
