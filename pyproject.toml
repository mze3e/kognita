[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "kognita"
version = "0.6.1"
description = "Prove an AI answer was permitted — and evidence it. A governed decision, retrieval and evidence library with an AI gateway and MCP proxy."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmed Muzammil" }]
keywords = [
    "governance",
    "policy-decision-point",
    "audit",
    "compliance",
    "rag",
    "ai-gateway",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

# The core must install and run on these four alone. Anything that reaches an
# external system — an LLM provider, a vector extension — is an extra.
dependencies = [
    "pydantic>=2.7.0",
    "sqlmodel>=0.0.22",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
signing = ["cryptography>=42"]
postgres = ["psycopg[binary]>=3.2"]
openai = ["openai>=1.91.0"]
vec = ["sqlite-vec>=0.1.6"]
local-embeddings = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sentence-transformers>=3.0.0",
]
# Pinned exactly. Named format extras only: not feat-chunking (transformers
# and tree-sitter grammars), not format-pdf, and not the docling metapackage
# (torch). PDF headings come from a layout model that pulls torch, so the
# extra does not ship a PDF parser it cannot use.
docling = [
    "docling-slim[format-docx,format-html,format-markdown]==2.140.0",
]
# One extra per framework adapter. They are not part of `all`: hermes-agent
# pins its own openai and pydantic, and the others pull their SDKs.
hermes-agent = ["hermes-agent>=0.19.0"]
openai-agents = ["openai-agents>=0.2.0"]
langgraph = ["langgraph>=0.2.0"]
pydantic-ai = ["pydantic-ai>=0.1.0"]
# OpenTelemetry export. The decision engine does not import it.
otel = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]
all = [
    "kognita[openai,vec,local-embeddings]",
]
dev = [
    "pytest>=8.0.0",
    "import-linter>=2.0",
]

# hermes-agent pins openai, pydantic and requests exactly. It cannot share an
# environment with the other framework extras, the openai extra, or docling.
[tool.uv]
conflicts = [
    [
        { extra = "hermes-agent" },
        { extra = "openai-agents" },
    ],
    [
        { extra = "hermes-agent" },
        { extra = "langgraph" },
    ],
    [
        { extra = "hermes-agent" },
        { extra = "pydantic-ai" },
    ],
    [
        { extra = "hermes-agent" },
        { extra = "openai" },
    ],
    [
        { extra = "hermes-agent" },
        { extra = "docling" },
    ],
]

[project.scripts]
kognita = "kognita.cli:main"

[project.urls]
Homepage = "https://github.com/mze3e/kognita"
Repository = "https://github.com/mze3e/kognita"
Issues = "https://github.com/mze3e/kognita/issues"
Changelog = "https://github.com/mze3e/kognita/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/kognita"]

[tool.hatch.build.targets.wheel.force-include]
"examples/governed-agent" = "kognita/_templates/governed-agent"

[tool.hatch.build.targets.sdist]
include = [
    "src/kognita/**",
    "tests/**",
    "examples/**",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

# ── Layering contracts ───────────────────────────────────────────────────────
# The decision engine lives directly in `kognita`, and must stay installable on
# the four hard dependencies. These contracts are what stop that from quietly
# regressing.
#
# Because the engine is a flat set of modules rather than a subpackage, the
# first contract has to name them. `tests/test_packaging.py` asserts that list
# covers every module actually present, so adding a module without listing it
# fails loudly instead of silently escaping the contract.
[tool.importlinter]
root_packages = ["kognita"]
# Required so the forbidden contracts can name third-party packages.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "the decision engine reaches nothing optional"
type = "forbidden"
source_modules = [
    "kognita._actions",
    "kognita._limits",
    "kognita._isolation",
    "kognita._fleet",
    "kognita._sandbox",
    "kognita.approvals",
    "kognita.autonomy",
    "kognita.anomaly",
    "kognita.authority",
    "kognita.breaker",
    "kognita.broker",
    "kognita.canonical",
    "kognita.classify",
    "kognita.claims",
    "kognita.calculations",
    "kognita.verification",
    "kognita.sources",
    "kognita.communication",
    "kognita.credentials",
    "kognita.db",
    "kognita.definitions",
    "kognita.egress",
    "kognita.embedding",
    "kognita.envelope",
    "kognita.evaluation",
    "kognita.anchoring",
    "kognita.backup",
    "kognita.evidence",
    "kognita.signing",
    "kognita.facts",
    "kognita.gateway",
    "kognita.governance",
    "kognita.interaction",
    "kognita.learning",
    "kognita.memory",
    "kognita.intervention",
    "kognita.mcp",
    "kognita.origination",
    "kognita.outcomes",
    "kognita.migrations",
    "kognita.models",
    "kognita.protocols",
    "kognita.postgres",
    "kognita.registry",
    "kognita.replay",
    "kognita.reconstruct",
    "kognita.recorder",
    "kognita.review",
    "kognita.retention",
    "kognita.sensitive",
    "kognita.revocation",
    "kognita.retrieval",
    "kognita.rules",
    "kognita.tools",
    "kognita.usecases",
    "kognita.vectors",
    "kognita.verification",
    "kognita.vocabulary",
]
forbidden_modules = [
    "kognita.adapters",
    "kognita.ingest",
    "kognita.policy",
    "kognita.testing",
    "kognita.cli",
    "graphiti_core",
    "kuzu",
    "openai",
    "anthropic",
    "streamlit",
    "docling",
    "docling_core",
    "docling_parse",
    "docling_ibm_models",
    "kognita.otel",
    "cryptography",
    "psycopg",
    "opentelemetry",
]

ignore_imports = ["kognita.signing -> cryptography"]

# The otel extra is the only place that imports OpenTelemetry. The decision
# engine, including the flight recorder, is the source list above.
[[tool.importlinter.contracts]]
name = "OpenTelemetry is reached only from the otel extra"
type = "forbidden"
source_modules = ["kognita"]
forbidden_modules = [
    "opentelemetry",
    "kognita.otel",
]
ignore_imports = [
    "kognita.cli -> kognita.otel",
    "kognita.otel -> opentelemetry",
]

[[tool.importlinter.contracts]]
name = "the module entry reaches nothing optional"
type = "forbidden"
source_modules = ["kognita.__main__"]
forbidden_modules = [
    "kognita.adapters",
    "kognita.testing",
    "graphiti_core",
    "kuzu",
    "openai",
    "anthropic",
    "streamlit",
    "yaml",
    "ruamel",
]

# The policy language calls decide(). governance imports the use-case register,
# so forbidding kognita.usecases here would forbid that call. policy.py does
# not name the register; tests/test_packaging.py checks the source.
[[tool.importlinter.contracts]]
name = "the policy language reaches nothing optional"
type = "forbidden"
source_modules = ["kognita.policy"]
forbidden_modules = [
    "kognita.adapters",
    "kognita.testing",
    "kognita.cli",
    "graphiti_core",
    "kuzu",
    "openai",
    "anthropic",
    "streamlit",
    "yaml",
    "ruamel",
]

[[tool.importlinter.contracts]]
name = "ingestion does not import docling"
type = "forbidden"
source_modules = [
    "kognita.ingest.chunker",
    "kognita.ingest.locator",
    "kognita.ingest.sections",
    "kognita.ingest.tree",
]
forbidden_modules = [
    "docling",
    "docling_core",
    "docling_parse",
    "docling_ibm_models",
]

# Framework SDKs are imported only by the adapter that owns them, and only
# inside the method that needs the type. The Hermes adapter does not import
# Hermes: Hermes calls the hook. `import kognita` never reaches a framework.
# The ignore list is the allow-list for the packages that are imported.
[[tool.importlinter.contracts]]
name = "the core never imports a framework"
type = "forbidden"
source_modules = ["kognita"]
forbidden_modules = [
    "hermes_cli",
    "hermes_bootstrap",
    "run_agent",
    "agents",
    "langgraph",
    "langchain_core",
    "pydantic_ai",
]
ignore_imports = [
    "kognita.adapters.openai_agents -> agents",
    "kognita.adapters.openai_agents -> openai",
    "kognita.adapters.langgraph -> langchain_core",
    "kognita.adapters.pydantic_ai -> pydantic_ai",
]

[[tool.importlinter.contracts]]
name = "config and exceptions stay dependency-free"
type = "forbidden"
source_modules = ["kognita.config", "kognita.exceptions"]
forbidden_modules = [
    "kognita.governance",
    "kognita.models",
    "kognita.evidence",
    "kognita.retrieval",
    "kognita.egress",
    "kognita.adapters",
    "kognita.testing",
    "kognita.cli",
    "pydantic",
    "sqlmodel",
    "numpy",
    "requests",
]

[[tool.importlinter.contracts]]
name = "optional trust drivers stay behind lazy boundaries"
type = "forbidden"
source_modules = ["kognita"]
# R2 replay uses the lazy signing boundary. Postgres uses SQLAlchemy driver
# loading only; even kognita.postgres must not import psycopg directly.
forbidden_modules = ["cryptography", "psycopg", "psycopg_binary", "psycopg_pool"]
ignore_imports = ["kognita.signing -> cryptography"]
